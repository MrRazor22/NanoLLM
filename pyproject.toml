[project]
name = "piqo"
version = "0.1.0"
description = "Ultra-fast, calibrated micro-decision engine designed with Primitive-First Design (PFD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "scipy>=1.12.0",
    "orjson>=3.9.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
data = [
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
]
benchmark = [
    "gliner>=0.2.0",
    "gliclass>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
